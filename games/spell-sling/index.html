<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スペル スリング — Spell Sling</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%B0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen" id="screen-title">
  <h1 class="h1-card">スペル スリング</h1>
  <div class="hint-jp">SPELL SLING · もじ を スリングして カイジュウ を こわせ！</div>
  <div class="level-pick">
    <button class="btn-cool huge" data-lv="0">🐣 入門 (みじかい たんご)</button>
    <button class="btn-hot huge" data-lv="1">⭐ ふつう (ふつう の たんご)</button>
    <button class="btn-hot huge" data-lv="2">🔥 むずかしい (ながい たんご)</button>
  </div>
  <div class="score-shelf" id="shelf"></div>
  <div style="margin-top: 16px;">
    <a class="btn-ghost" href="../index.html" style="text-decoration:none;display:inline-block;">← もどる</a>
  </div>
</div>

<div class="screen hidden" id="screen-game">
  <div class="game-hud">
    <div class="hud-target">
      <div class="hud-target-jp" id="hud-jp"></div>
      <div class="hud-combo" id="hud-combo">COMBO ×0</div>
    </div>
    <div class="hud-right">
      <span class="hud-rounds" id="hud-rounds"></span>
      <button class="btn-ghost hud-quit" id="hud-quit">×</button>
    </div>
  </div>

  <div class="arena">
    <div class="boss-zone" id="boss-zone"></div>
    <div class="blanks" id="blanks"></div>
    <button class="btn-cool replay" id="btn-replay">🔊 もう 1かい きく</button>
    <div class="letter-pad" id="letter-pad"></div>
  </div>
</div>

<div class="screen hidden" id="screen-result">
  <div class="result-banner" id="result-banner"></div>
  <div class="result-word" id="result-word"></div>
  <div class="result-art" id="result-art"></div>
  <div class="result-msg" id="result-msg"></div>
  <div class="row" style="gap:10px; margin-top:14px;">
    <button class="btn-hot huge" id="btn-next">つぎへ</button>
    <button class="btn-ghost" id="btn-home">ホーム</button>
  </div>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/locale/ja.js"></script>
<script src="../../js/locale/ja_shiny.js"></script>
<script src="../../js/monsters.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/boss-art.js"></script>
<script src="main.js"></script>
</body>
</html>
