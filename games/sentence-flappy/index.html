<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ぶんぽう フラッピー — Sentence Flappy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%90%A6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen" id="screen-title">
  <h1 class="h1-card">ぶんぽう フラッピー</h1>
  <div class="hint-jp">SENTENCE FLAPPY · ことば を じゅんばん に あつめろ！ まちがえる と カイジュウ が こわれる</div>

  <!-- Animated kaiju showcase that cycles through the cast. Gives the
       title screen life and signals which kaiju are playable. -->
  <div class="title-kaiju" id="title-kaiju"></div>

  <div class="level-pick">
    <button class="btn-cool huge" data-lv="0">🐣 入門 (たんご 1〜2 ご)</button>
    <button class="btn-hot huge" data-lv="1">⭐ ふつう (みじかい ぶん)</button>
    <button class="btn-hot huge" data-lv="2">🔥 むずかしい (ながい ぶん)</button>
  </div>

  <div style="margin-top: 24px;">
    <a class="btn-ghost" href="../index.html" style="text-decoration:none;display:inline-block;">← もどる</a>
  </div>
</div>

<div class="screen hidden" id="screen-pick">
  <h2 style="color:var(--accent); letter-spacing:3px;">カイジュウ を えらべ！</h2>
  <div id="pick-grid" class="pick-grid"></div>
  <button class="btn-ghost" id="pick-back">← レベル せんたく</button>
</div>

<div class="screen hidden" id="screen-game" style="padding:0;">
  <div class="game-hud">
    <div class="hud-target">
      <div class="hud-jp" id="hud-jp">
        <span id="hud-jp-text"></span>
        <button class="hud-peek" id="hud-peek">のぞく</button>
      </div>
      <div class="hud-en" id="hud-en"></div>
      <div class="hud-jp-line" id="hud-jp-line"></div>
    </div>
    <div class="hud-side">
      <div class="hud-parts" id="hud-parts"></div>
      <button class="btn-ghost hud-quit" id="hud-quit">×</button>
    </div>
  </div>
  <canvas id="cv"></canvas>
  <div class="tap-hint" id="tap-hint">タップ で はばたく</div>
</div>

<div class="screen hidden" id="screen-win">
  <div class="win-banner">SENTENCE COMPLETE!</div>
  <div class="win-en" id="win-en"></div>
  <div class="win-jp" id="win-jp"></div>
  <div class="win-art" id="win-art"></div>
  <div class="win-stats" id="win-stats"></div>
  <div class="row" style="gap:10px; margin-top:14px;">
    <button class="btn-hot huge" id="win-again">もう 1 かい</button>
    <button class="btn-cool" id="win-menu">べつの カイジュウ</button>
    <button class="btn-ghost" id="win-home">ホーム</button>
  </div>
</div>

<div class="screen hidden" id="screen-lose">
  <div class="lose-banner" id="lose-banner">CORE BROKEN</div>
  <div class="lose-jp" id="lose-jp"></div>
  <div class="lose-progress" id="lose-progress"></div>
  <div class="row" style="gap:10px; margin-top:14px;">
    <button class="btn-hot huge" id="lose-retry">リトライ</button>
    <button class="btn-ghost" id="lose-home">ホーム</button>
  </div>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/locale/ja.js"></script>
<script src="../../js/locale/ja_shiny.js"></script>
<script src="../../js/monsters.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/boss-art.js"></script>
<script src="sentences.js"></script>
<script src="sentences-extra.js"></script>
<script src="main.js"></script>

<!-- Cycling kaiju showcase on the title screen. Bounces in, holds for
     a beat, fades out, swaps to the next. Touch-pause when the kid
     hovers/taps so they can read the kaiju's name. -->
<script>
(function () {
  const slot = document.getElementById("title-kaiju");
  if (!slot || !window.GamesArt) return;
  const ids = ["tako","unko","tral","pamp","parfait","anpan","temee","catcherski"];
  let i = 0; let paused = false;
  function tick() {
    if (paused) return;
    const boss = GamesArt.get(ids[i % ids.length], true);
    if (!boss) { i++; return; }
    slot.innerHTML = `<div class="tk-sv">${GamesArt.renderSVG(boss)}</div><div class="tk-name">${boss.name_jp || ids[i % ids.length]}</div>`;
    slot.classList.remove("tk-in"); void slot.offsetWidth; slot.classList.add("tk-in");
    i++;
  }
  tick();
  const iv = setInterval(tick, 3200);
  slot.addEventListener("pointerenter", () => paused = true);
  slot.addEventListener("pointerleave", () => paused = false);
})();
</script>
</body>
</html>
