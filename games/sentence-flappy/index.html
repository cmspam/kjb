<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ぶんぽう フラッピー — Sentence Flappy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%90%A6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LAYER 1: TITLE / MENU -->
<div class="screen" id="screen-title">
  <h1 class="h1-card">ぶんぽう フラッピー</h1>
  <div class="hint-jp">SENTENCE FLAPPY · あつめて ぶん を つくれ！</div>

  <div class="level-pick">
    <button class="btn-cool huge" data-lv="0">🐣 入門 (たんご 1つ)</button>
    <button class="btn-hot huge" data-lv="1">⭐ ふつう (みじかい ぶん)</button>
    <button class="btn-hot huge" data-lv="2">🔥 むずかしい (ながい ぶん)</button>
  </div>

  <div style="margin-top: 24px;">
    <a class="btn-ghost" href="../index.html" style="text-decoration:none;display:inline-block;">← もどる</a>
  </div>
</div>

<!-- LAYER 2: KAIJU SELECT -->
<div class="screen hidden" id="screen-pick">
  <h2 style="color:var(--accent); letter-spacing:3px;">カイジュウを えらべ！</h2>
  <div id="pick-grid" class="pick-grid"></div>
  <button class="btn-ghost" id="pick-back">← レベル せんたく</button>
</div>

<!-- LAYER 3: GAME -->
<div class="screen hidden" id="screen-game" style="padding:0;">
  <div class="game-hud">
    <div class="hud-target">
      <div class="hud-target-jp" id="hud-jp"></div>
      <div class="hud-target-en" id="hud-en"></div>
    </div>
    <div class="hud-right">
      <span class="hud-lives" id="hud-lives">❤️❤️❤️</span>
      <button class="btn-ghost hud-quit" id="hud-quit">×</button>
    </div>
  </div>
  <canvas id="cv"></canvas>
  <div class="tap-hint" id="tap-hint">タップ で はばたく</div>
</div>

<!-- LAYER 4: SUCCESS -->
<div class="screen hidden" id="screen-win">
  <div class="win-banner">クリア！</div>
  <div class="win-en" id="win-en"></div>
  <div class="win-jp" id="win-jp"></div>
  <div class="win-art" id="win-art"></div>
  <div class="win-diagnosis" id="win-diagnosis"></div>
  <div class="row" style="gap:10px; margin-top:14px;">
    <button class="btn-hot huge" id="win-again">もう 1 かい</button>
    <button class="btn-cool" id="win-menu">べつの カイジュウ</button>
    <button class="btn-ghost" id="win-home">ホーム</button>
  </div>
</div>

<!-- LAYER 5: DEFEAT -->
<div class="screen hidden" id="screen-lose">
  <div class="lose-banner">ANCESTOR FAIL</div>
  <div class="lose-jp" id="lose-jp"></div>
  <div class="lose-line" id="lose-line"></div>
  <div class="row" style="gap:10px; margin-top:14px;">
    <button class="btn-hot huge" id="lose-retry">リトライ</button>
    <button class="btn-ghost" id="lose-home">ホーム</button>
  </div>
</div>

<!-- KJB shared scripts: locale + monsters for boss art and voice paths -->
<script src="../../js/i18n.js"></script>
<script src="../../js/locale/ja.js"></script>
<script src="../../js/locale/ja_shiny.js"></script>
<script src="../../js/monsters.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/boss-art.js"></script>
<script src="main.js"></script>
</body>
</html>
