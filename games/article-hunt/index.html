<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アーティクル ハント — Article Hunt</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9C%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen" id="screen-title">
  <h1 class="h1-card">アーティクル ハント</h1>
  <div class="hint-jp">ARTICLE HUNT · a / an / the / なし を えらべ！</div>
  <div class="rules-hint">
    <div class="rh-row"><span class="rh-tag">a</span> <span>こえ が「うえお あ い」で はじまらない 一つ の もの</span></div>
    <div class="rh-row"><span class="rh-tag">an</span> <span>こえ が「あ い う え お」で はじまる 一つ の もの</span></div>
    <div class="rh-row"><span class="rh-tag">the</span> <span>ただ ひとつ しか ない もの (the sun, the moon)</span></div>
    <div class="rh-row"><span class="rh-tag">—</span> <span>かぞえられない、 ふくすう (homework, water, dogs)</span></div>
  </div>
  <div class="level-pick">
    <button class="btn-cool huge" data-lv="0">⭐ ふつう (じかん たっぷり)</button>
    <button class="btn-hot huge" data-lv="1">🔥 むずかしい (はやい)</button>
  </div>
  <div class="best" id="best"></div>
  <div style="margin-top: 16px;">
    <a class="btn-ghost" href="../index.html" style="text-decoration:none;display:inline-block;">← もどる</a>
  </div>
</div>

<div class="screen hidden" id="screen-game">
  <div class="game-hud">
    <div class="hud-progress" id="hud-progress">1/10</div>
    <div class="hud-score" id="hud-score">★ 0</div>
    <div class="hud-time" id="hud-time">⏱</div>
    <button class="btn-ghost hud-quit" id="hud-quit">×</button>
  </div>

  <div class="item-zone">
    <div class="item-emoji" id="item-emoji">?</div>
    <div class="item-word" id="item-word">?</div>
    <div class="item-jp" id="item-jp">?</div>
  </div>

  <div class="article-pad" id="article-pad"></div>
</div>

<div class="screen hidden" id="screen-result">
  <div class="result-banner" id="result-banner"></div>
  <div class="result-stats" id="result-stats"></div>
  <div class="result-msg" id="result-msg"></div>
  <div class="row" style="gap:10px;margin-top:14px;">
    <button class="btn-hot huge" id="btn-again">もう 1かい</button>
    <button class="btn-ghost" id="btn-home">ホーム</button>
  </div>
</div>

<script src="../shared/audio.js"></script>
<script src="main.js"></script>
</body>
</html>
