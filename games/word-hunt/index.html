<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ワード ハント — Word Hunt</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen" id="screen-title">
  <h1 class="h1-card">ワード ハント</h1>
  <div class="hint-jp">WORD HUNT · え の なかから ことば を さがせ！</div>
  <div class="level-pick">
    <button class="btn-cool huge" data-lv="0">⭐ ふつう (60びょう)</button>
    <button class="btn-hot huge" data-lv="1">🔥 むずかしい (45びょう)</button>
  </div>
  <div class="best" id="best"></div>
  <div style="margin-top: 16px;">
    <a class="btn-ghost" href="../index.html" style="text-decoration:none;display:inline-block;">← もどる</a>
  </div>
</div>

<div class="screen hidden" id="screen-game">
  <div class="game-hud">
    <div class="hud-target">
      <div class="hud-find" id="hud-find"></div>
      <div class="hud-jp-hint" id="hud-jp-hint"></div>
    </div>
    <div class="hud-time" id="hud-time">⏱ 60</div>
    <button class="btn-ghost hud-quit" id="hud-quit">×</button>
  </div>
  <div class="scene-wrap">
    <img class="scene-img" id="scene-img" alt="">
    <div class="hotspot-layer" id="hotspot-layer"></div>
    <div class="hot-cold" id="hot-cold"></div>
  </div>
  <div class="bottom-bar">
    <button class="btn-cool" id="btn-repeat">🔊 もう 1かい きく</button>
    <span class="found-count" id="found-count">0 / 0</span>
  </div>
</div>

<div class="screen hidden" id="screen-result">
  <div class="result-banner" id="result-banner"></div>
  <div class="result-stats" id="result-stats"></div>
  <div class="result-msg" id="result-msg"></div>
  <div class="row" style="gap:10px;margin-top:14px;">
    <button class="btn-hot huge" id="btn-again">もう 1かい</button>
    <button class="btn-ghost" id="btn-home">ホーム</button>
  </div>
</div>

<script src="../shared/audio.js"></script>
<script src="main.js"></script>
</body>
</html>
