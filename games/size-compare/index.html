<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>サイズ くらべ — Size Compare</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9A%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen" id="screen-title">
  <h1 class="h1-card">サイズ くらべ</h1>
  <div class="hint-jp">SIZE COMPARE · bigger / smaller / taller / shorter / faster / slower</div>
  <div class="rules-hint">くらべて タップ！ えいご の くらべる ことば を おぼえよう。</div>
  <div class="level-pick">
    <button class="btn-cool huge" data-lv="0">⭐ ふつう (big / small)</button>
    <button class="btn-hot huge" data-lv="1">🔥 むずかしい (all comparatives)</button>
  </div>
  <div class="best" id="best"></div>
  <div style="margin-top: 16px;">
    <a class="btn-ghost" href="../index.html" style="text-decoration:none;display:inline-block;">← もどる</a>
  </div>
</div>

<div class="screen hidden" id="screen-game">
  <div class="game-hud">
    <div class="hud-progress" id="hud-progress">1/10</div>
    <div class="hud-question" id="hud-question">★</div>
    <div class="hud-score" id="hud-score">★ 0</div>
    <button class="btn-ghost hud-quit" id="hud-quit">×</button>
  </div>

  <div class="compare-arena" id="arena">
    <button class="comp-side" id="side-A">
      <div class="cs-art" id="art-A"></div>
      <div class="cs-name" id="name-A"></div>
    </button>
    <div class="compare-vs">VS</div>
    <button class="comp-side" id="side-B">
      <div class="cs-art" id="art-B"></div>
      <div class="cs-name" id="name-B"></div>
    </button>
  </div>

  <button class="btn-cool replay" id="btn-replay">🔊 もう 1かい</button>
</div>

<div class="screen hidden" id="screen-result">
  <div class="result-banner" id="result-banner"></div>
  <div class="result-stats" id="result-stats"></div>
  <div class="result-msg" id="result-msg"></div>
  <div class="row" style="gap:10px;margin-top:14px;">
    <button class="btn-hot huge" id="btn-again">もう 1かい</button>
    <button class="btn-ghost" id="btn-home">ホーム</button>
  </div>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/locale/ja.js"></script>
<script src="../../js/locale/ja_shiny.js"></script>
<script src="../../js/monsters.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/boss-art.js"></script>
<script src="main.js"></script>
</body>
</html>
