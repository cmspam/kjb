<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ストーリー クエスト — Story Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen" id="screen-title">
  <h1 class="h1-card">ストーリー クエスト</h1>
  <div class="hint-jp">STORY QUEST · カイジュウ と えいご で はなそう。 ことば を タップ すれば、 にほんご の いみ が わかる。</div>
  <div class="title-buttons">
    <button class="btn-hot huge" id="btn-start">はじめる →</button>
    <button class="btn-cool" id="btn-journal">📔 フレーズ ノート</button>
  </div>
  <div class="met-shelf" id="met-shelf"></div>
  <div style="margin-top: 16px;">
    <a class="btn-ghost" href="../index.html" style="text-decoration:none;display:inline-block;">← もどる</a>
  </div>
</div>

<div class="screen hidden" id="screen-journal">
  <h2 style="color:var(--accent); letter-spacing:3px;">📔 フレーズ ノート</h2>
  <div class="journal-pick" id="journal-pick"></div>
  <div class="journal-list" id="journal-list"></div>
  <button class="btn-ghost" id="journal-back" style="margin-top:14px;">← ホーム</button>
</div>

<div class="screen hidden" id="screen-kaiju">
  <h2 style="color:var(--accent); letter-spacing:3px;">カイジュウ を えらぶ</h2>
  <div class="kaiju-grid" id="kaiju-grid"></div>
  <button class="btn-ghost" id="kaiju-back">← ホーム</button>
</div>

<div class="screen hidden" id="screen-conv-pick">
  <h2 class="conv-pick-title" id="conv-pick-title"></h2>
  <div class="conv-list" id="conv-list"></div>
  <button class="btn-ghost" id="conv-back">← カイジュウ せんたく</button>
</div>

<div class="screen hidden" id="screen-story">
  <div class="vn-scene" id="vn-scene"></div>

  <div class="vn-quit-row">
    <button class="btn-ghost vn-quit" id="vn-quit">×</button>
  </div>

  <div class="vn-kaiju-wrap">
    <div class="vn-kaiju" id="vn-kaiju"></div>
    <div class="vn-mood" id="vn-mood">😄</div>
    <div class="vn-name" id="vn-name"></div>
  </div>

  <div class="vn-box">
    <div class="vn-bubble" id="vn-bubble"></div>
    <div class="vn-bubble-replay">
      <button class="btn-cool" id="btn-replay-kaiju">🔊</button>
    </div>
    <div class="vn-choices" id="vn-choices"></div>
  </div>
</div>

<div class="screen hidden" id="screen-end">
  <div class="end-banner" id="end-banner"></div>
  <div class="end-emoji" id="end-emoji">🎉</div>
  <div class="end-en" id="end-en"></div>
  <div class="end-jp" id="end-jp"></div>
  <div class="end-stats" id="end-stats"></div>
  <div class="row" style="gap:10px;margin-top:14px;">
    <button class="btn-hot huge" id="btn-conv-again">べつの かいわ</button>
    <button class="btn-cool" id="btn-end-kaiju">べつの カイジュウ</button>
    <button class="btn-ghost" id="btn-end-home">ホーム</button>
  </div>
</div>

<!-- Word popup overlay (per-word tap → JP gloss + audio) -->
<div class="word-popup hidden" id="word-popup">
  <div class="wp-en" id="wp-en">word</div>
  <div class="wp-jp" id="wp-jp">いみ</div>
  <button class="wp-close" id="wp-close">OK</button>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/locale/ja.js"></script>
<script src="../../js/locale/ja_shiny.js"></script>
<script src="../../js/monsters.js"></script>
<script src="../../js/stages.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/boss-art.js"></script>
<script src="scenes.js"></script>
<script src="dialogue.js"></script>
<script src="main.js"></script>
</body>
</html>
