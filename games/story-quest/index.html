<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ストーリー クエスト — Story Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen" id="screen-title">
  <h1 class="h1-card">ストーリー クエスト</h1>
  <div class="hint-jp">STORY QUEST · カイジュウ と であえ、 えいご で こたえよう</div>
  <div class="level-pick">
    <button class="btn-cool huge" data-lv="0">⭐ ふつう (2 たくいつ)</button>
    <button class="btn-hot huge" data-lv="1">🔥 むずかしい (3 たくいつ)</button>
  </div>
  <div class="meet-shelf" id="meet-shelf"></div>
  <div style="margin-top: 16px;">
    <a class="btn-ghost" href="../index.html" style="text-decoration:none;display:inline-block;">← もどる</a>
  </div>
</div>

<div class="screen hidden" id="screen-game">
  <div class="vn-scene" id="vn-scene"></div>
  <div class="vn-kaiju-wrap">
    <div class="vn-kaiju" id="vn-kaiju"></div>
    <div class="vn-name" id="vn-name"></div>
  </div>
  <div class="vn-box">
    <div class="vn-bubble" id="vn-bubble"></div>
    <div class="vn-choices" id="vn-choices"></div>
  </div>
  <button class="btn-ghost vn-quit" id="vn-quit">×</button>
</div>

<div class="screen hidden" id="screen-outcome">
  <div class="outcome-banner" id="outcome-banner"></div>
  <div class="outcome-tag" id="outcome-tag"></div>
  <div class="outcome-art" id="outcome-art"></div>
  <div class="outcome-msg" id="outcome-msg"></div>
  <div class="row" style="gap:10px;margin-top:14px;">
    <button class="btn-hot huge" id="btn-next-encounter">べつの カイジュウ</button>
    <button class="btn-ghost" id="btn-home">ホーム</button>
  </div>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/locale/ja.js"></script>
<script src="../../js/locale/ja_shiny.js"></script>
<script src="../../js/monsters.js"></script>
<script src="../../js/stages.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/boss-art.js"></script>
<script src="dialogue.js"></script>
<script src="main.js"></script>
</body>
</html>
