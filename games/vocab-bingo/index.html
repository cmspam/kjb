<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>カイジュウ ビンゴ — Vocab Bingo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TITLE -->
<div class="screen" id="screen-title">
  <h1 class="h1-card">カイジュウ ビンゴ</h1>
  <div class="hint-jp">VOCAB BINGO · きこえた えいご の カイジュウ を タップ！</div>

  <div class="level-pick">
    <button class="btn-cool huge" data-lv="0">🐣 入門 (たんご)</button>
    <button class="btn-hot huge" data-lv="1">⭐ ふつう (たんご+ヒント)</button>
  </div>

  <div class="sticker-row" id="sticker-row" aria-label="あつめた シール"></div>

  <div style="margin-top: 20px;">
    <a class="btn-ghost" href="../index.html" style="text-decoration:none;display:inline-block;">← もどる</a>
  </div>
</div>

<!-- GAME -->
<div class="screen hidden" id="screen-game">
  <div class="game-hud">
    <div class="hud-prompt" id="hud-prompt"></div>
    <div class="hud-right">
      <span id="hud-stickers" class="hud-stickers"></span>
      <button class="btn-ghost hud-quit" id="hud-quit">×</button>
    </div>
  </div>
  <div class="bingo-grid" id="bingo-grid"></div>
  <button class="btn-cool replay" id="btn-replay">🔊 もう 1かい きく</button>
</div>

<!-- ROUND COMPLETE -->
<div class="screen hidden" id="screen-round">
  <div class="round-banner" id="round-banner">SUGOI!</div>
  <div class="round-rewards" id="round-rewards"></div>
  <div class="round-diagnosis" id="round-diagnosis"></div>
  <div class="row" style="gap:10px; margin-top:14px;">
    <button class="btn-hot huge" id="btn-next">つぎへ</button>
    <button class="btn-ghost" id="btn-home">ホーム</button>
  </div>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/locale/ja.js"></script>
<script src="../../js/locale/ja_shiny.js"></script>
<script src="../../js/monsters.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/boss-art.js"></script>
<script src="main.js"></script>
</body>
</html>
