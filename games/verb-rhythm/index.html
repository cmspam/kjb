<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>どうし リズム — Verb Rhythm</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen" id="screen-title">
  <h1 class="h1-card">どうし リズム</h1>
  <div class="hint-jp">VERB RHYTHM · タイミング よく タップ！ カイジュウ が おどる！</div>
  <div class="level-pick">
    <button class="btn-cool huge" data-lv="0">⭐ ふつう (ゆっくり)</button>
    <button class="btn-hot huge" data-lv="1">🔥 むずかしい (はやい)</button>
  </div>
  <div class="best" id="best"></div>
  <div style="margin-top: 16px;">
    <a class="btn-ghost" href="../index.html" style="text-decoration:none;display:inline-block;">← もどる</a>
  </div>
</div>

<div class="screen hidden" id="screen-game">
  <div class="game-hud">
    <div class="hud-left">
      <div class="hud-combo" id="hud-combo">×0</div>
      <div class="hud-score" id="hud-score">0</div>
    </div>
    <div class="hud-chaos-wrap">
      <div class="hud-chaos-label">CHAOS</div>
      <div class="hud-chaos-bar"><div class="hud-chaos-fill" id="hud-chaos-fill"></div></div>
    </div>
    <button class="btn-ghost hud-quit" id="hud-quit">×</button>
  </div>

  <div class="rhythm-arena" id="arena">
    <div class="boss-display" id="boss-display"></div>
    <div class="track">
      <div class="now-zone"></div>
      <div class="track-notes" id="track-notes"></div>
    </div>
    <div class="tap-zone" id="tap-zone">タップ ！</div>
  </div>
</div>

<div class="screen hidden" id="screen-result">
  <div class="result-banner" id="result-banner"></div>
  <div class="result-score" id="result-score"></div>
  <div class="result-art" id="result-art"></div>
  <div class="result-msg" id="result-msg"></div>
  <div class="row" style="gap:10px; margin-top:14px;">
    <button class="btn-hot huge" id="btn-again">もう 1かい</button>
    <button class="btn-ghost" id="btn-home">ホーム</button>
  </div>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/locale/ja.js"></script>
<script src="../../js/locale/ja_shiny.js"></script>
<script src="../../js/monsters.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/boss-art.js"></script>
<script src="main.js"></script>
</body>
</html>
