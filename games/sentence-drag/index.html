<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>センテンス ドラッグ — Sentence Drag</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9C%8B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen" id="screen-title">
  <h1 class="h1-card">センテンス ドラッグ</h1>
  <div class="hint-jp">SENTENCE DRAG · タップ で じゅんばん に ならべて ぶん を つくる</div>
  <div class="level-pick">
    <button class="btn-cool huge" data-lv="0">🐣 入門 (みじかい)</button>
    <button class="btn-hot huge" data-lv="1">⭐ ふつう (ふつう)</button>
    <button class="btn-hot huge" data-lv="2">🔥 むずかしい (ながい)</button>
  </div>
  <div class="best" id="best"></div>
  <div style="margin-top: 16px;">
    <a class="btn-ghost" href="../index.html" style="text-decoration:none;display:inline-block;">← もどる</a>
  </div>
</div>

<div class="screen hidden" id="screen-game">
  <div class="game-hud">
    <div class="hud-kaiju" id="hud-kaiju">★</div>
    <div class="hud-progress" id="hud-progress">1/5</div>
    <button class="btn-ghost hud-quit" id="hud-quit">×</button>
  </div>
  <div class="prompt-box">
    <div class="prompt-jp" id="prompt-jp"></div>
    <button class="btn-cool prompt-replay" id="btn-replay">🔊</button>
  </div>
  <div class="boss-frame" id="boss-frame"></div>
  <div class="answer-tray" id="answer-tray"></div>
  <div class="pool-tray" id="pool-tray"></div>
  <button class="btn-hot huge submit-btn" id="btn-submit">こたえる →</button>
</div>

<div class="screen hidden" id="screen-round">
  <div class="round-banner" id="round-banner"></div>
  <div class="round-en" id="round-en"></div>
  <div class="round-jp" id="round-jp"></div>
  <div class="round-art" id="round-art"></div>
  <div class="round-msg" id="round-msg"></div>
  <div class="row" style="gap:10px;margin-top:12px;">
    <button class="btn-hot huge" id="btn-next">つぎ →</button>
    <button class="btn-ghost" id="btn-home">ホーム</button>
  </div>
</div>

<script src="../../js/i18n.js"></script>
<script src="../../js/locale/ja.js"></script>
<script src="../../js/locale/ja_shiny.js"></script>
<script src="../../js/monsters.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/boss-art.js"></script>
<script src="main.js"></script>
</body>
</html>
