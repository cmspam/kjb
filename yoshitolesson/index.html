<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>コードで あそぼう！ 〜ニャーニャコ プログラミング〜</title>
<style>
  :root{
    --bg1:#143a2e; --bg2:#0c241c; --panel:#16241f; --panel2:#1f3a30;
    --accent:#8be04f; --accent2:#ffd23f; --line:#2f5a47; --code:#0e1a16;
    --pink:#ff8af0; --blue:#5aa9e6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;color:#fff;background:#07120e;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;user-select:none;}
  #app{position:relative;width:100vw;height:100vh;overflow:hidden;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;}
  .screen.active{display:flex;}
  button{font-family:inherit;}
  .bigbtn{font-size:20px;font-weight:bold;padding:13px 26px;border:4px solid #000;border-radius:16px;cursor:pointer;
    background:var(--accent);color:#0a2a00;box-shadow:0 6px 0 #00000088;}
  .bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #00000088;}
  .bigbtn.gold{background:var(--accent2);color:#3a2a00;}
  .bigbtn.pink{background:var(--pink);color:#3a1030;}
  .bigbtn:disabled{background:#3a4a42;color:#7a8a80;box-shadow:0 6px 0 #00000044;}

  /* ===== HOME ===== */
  #home{align-items:center;justify-content:flex-start;text-align:center;padding:18px 14px 14px;
    background:radial-gradient(circle at 50% 12%,#1d5340,#0a1f17 72%);overflow-y:auto;}
  #home h1{font-size:7.5vw;margin:6px 0 2px;color:var(--accent);text-shadow:3px 3px 0 #000;line-height:1.05;}
  #home .sub{font-size:3.4vw;color:#cfe;margin-bottom:10px;}
  .guidetop{width:120px;height:120px;margin:2px auto;}
  .lessongrid{display:flex;flex-direction:column;gap:11px;width:100%;max-width:520px;margin:8px auto 0;}
  .lesnode{display:flex;align-items:center;gap:13px;background:var(--panel2);border:3px solid var(--line);
    border-radius:16px;padding:13px 15px;cursor:pointer;transition:transform .08s;text-align:left;}
  .lesnode:active{transform:scale(.98);}
  .lesnode.locked{opacity:.5;border-style:dashed;cursor:default;}
  .lesnode.cleared{border-color:var(--accent2);box-shadow:0 0 10px #ffd23f44;}
  .lesnode .ln{width:42px;height:42px;flex:0 0 42px;background:#000;border:2px solid var(--accent);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:bold;color:var(--accent);font-size:20px;}
  .lesnode .lt{flex:1;min-width:0;}
  .lesnode .lt b{font-size:16px;} .lesnode .lt span{display:block;font-size:12px;color:#bdd;}
  .lesnode .lic{font-size:24px;}
  .homebtns{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center;}
  .mutehome{position:absolute;top:12px;right:14px;background:#000;border:2px solid var(--line);border-radius:18px;
    padding:6px 12px;font-size:16px;cursor:pointer;z-index:3;}

  /* ===== LESSON ===== */
  #lesson{background:linear-gradient(180deg,#13302632,#0a1f17),#0a1f17;}
  .leshead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:3px solid #000;}
  .leshead h2{margin:0;font-size:17px;color:var(--accent);flex:1;}
  .backbtn{background:var(--panel2);border:2px solid var(--line);color:#fff;border-radius:10px;padding:8px 13px;font-weight:bold;cursor:pointer;}
  .lesbody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto;width:100%;}

  /* guide bubble */
  .guide{display:flex;align-items:flex-end;gap:8px;}
  .guide .gface{width:64px;height:64px;flex:0 0 64px;}
  .guide .bubble{position:relative;background:#fff;color:#173;border-radius:14px;padding:10px 13px;font-size:14px;
    font-weight:bold;line-height:1.5;flex:1;box-shadow:0 3px 0 #0006;}
  .guide .bubble:after{content:"";position:absolute;left:-9px;bottom:14px;border:7px solid transparent;border-right-color:#fff;}

  /* code panel */
  .codebox{background:var(--code);border:2px solid var(--line);border-radius:12px;padding:12px 14px;
    font-family:"SF Mono","Consolas","Courier New",monospace;font-size:15px;line-height:1.7;color:#9fe6b0;overflow-x:auto;}
  .codebox .k{color:#ff9ec4;} .codebox .n{color:#ffd23f;font-weight:bold;}
  .codebox .s{color:#9fd8ff;} .codebox .c{color:#6a8a78;} .codebox .hl{background:#2a4a1a;border-radius:4px;padding:0 3px;}

  /* preview stage */
  .stage{position:relative;height:200px;background:radial-gradient(circle at 80% 18%,rgba(255,255,255,.1),transparent 45%),
      linear-gradient(180deg,#21304d 0%,#3a5a8a 72%,#a9c6f0 80%);border:3px solid var(--line);border-radius:14px;overflow:hidden;}
  .stage .ground{position:absolute;bottom:0;left:0;right:0;height:22%;background:repeating-linear-gradient(90deg,#2c2436 0 34px,#332a40 34px 68px);border-top:4px solid #1b1626;}
  .spr{position:absolute;bottom:14%;will-change:transform,left;}
  .spr svg{display:block;filter:drop-shadow(0 5px 3px rgba(0,0,0,.4));}
  .spr .hp{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:70%;height:5px;background:#000;border:1px solid #fff;border-radius:3px;overflow:hidden;}
  .spr .hp>i{display:block;height:100%;background:var(--accent);}
  .spr.foe .hp>i{background:#ff5b5b;}
  @keyframes walkB{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-3px) rotate(2deg);}}
  .spr.walk svg{animation:walkB .42s infinite ease-in-out;}
  .pop{position:absolute;font-weight:bold;font-size:15px;text-shadow:1px 1px 0 #000;pointer-events:none;animation:popUp 1s forwards;z-index:5;}
  @keyframes popUp{to{transform:translateY(-38px);opacity:0;}}
  .ring{position:absolute;border-radius:50%;border:4px solid #fff;pointer-events:none;animation:ringExp .5s ease-out forwards;}
  @keyframes ringExp{from{transform:scale(.2);opacity:.9;}to{transform:scale(2.4);opacity:0;}}

  /* controls */
  .ctl{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:12px;}
  .slider{display:flex;align-items:center;gap:10px;}
  .slider label{width:96px;font-weight:bold;font-size:14px;}
  .slider input[type=range]{flex:1;height:30px;accent-color:var(--accent);}
  .slider .val{width:54px;text-align:right;font-weight:bold;color:var(--accent2);font-family:monospace;font-size:16px;}
  .swatches{display:flex;flex-wrap:wrap;gap:8px;}
  .sw{width:42px;height:42px;border-radius:10px;border:3px solid #0006;cursor:pointer;}
  .sw.sel{border-color:#fff;box-shadow:0 0 8px #fff;transform:scale(1.08);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:12px;
    padding:7px 11px;cursor:pointer;font-weight:bold;font-size:13px;}
  .chip svg{width:30px;height:30px;}
  .chip:active{transform:scale(.95);}
  .wavelist{display:flex;flex-wrap:wrap;gap:6px;min-height:48px;background:var(--code);border:2px dashed var(--line);border-radius:10px;padding:8px;align-content:flex-start;}
  .wavelist svg{width:34px;height:34px;}
  .goalbar{background:#1a2e10;border:2px solid var(--accent);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:bold;color:var(--accent);}
  .actrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .pickrow{display:flex;gap:10px;flex-wrap:wrap;}
  .pickbtn{background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:bold;cursor:pointer;font-size:15px;}
  .pickbtn:active{transform:scale(.96);}

  /* clear overlay */
  .clearov{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(6,18,12,.94);text-align:center;padding:22px;}
  .clearov.show{display:flex;animation:fadeIn .3s;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .clearov h1{font-size:9vw;color:var(--accent2);margin:0 0 8px;text-shadow:3px 3px 0 #000;}
  .clearov .gface{width:120px;height:120px;}
  .clearov p{font-size:16px;max-width:460px;line-height:1.6;}
  .confetti{position:absolute;width:9px;height:15px;top:-20px;z-index:1;animation:fall 1.4s linear forwards;}
  @keyframes fall{to{transform:translateY(95vh) rotate(540deg);opacity:.2;}}
  .star{position:absolute;background:#fff;border-radius:50%;opacity:.7;animation:tw 2.2s infinite alternate;}
  @keyframes tw{from{opacity:.15}to{opacity:.9}}
</style>
</head>
<body>
<div id="app">
  <!-- ===== HOME ===== -->
  <section class="screen active" id="home">
    <button class="mutehome" id="muteHome">🔊</button>
    <div class="guidetop" id="guideTop"></div>
    <h1>コードで あそぼう！</h1>
    <div class="sub">〜 ニャーニャコ プログラミング 〜</div>
    <div class="lessongrid" id="lessonGrid"></div>
    <div class="homebtns">
      <a class="bigbtn gold" href="../yoshito2/" style="text-decoration:none">🎮 ゲームで あそぶ</a>
    </div>
  </section>

  <!-- ===== LESSON ===== -->
  <section class="screen" id="lesson">
    <div class="leshead">
      <button class="backbtn" id="lesBack">← もどる</button>
      <h2 id="lesTitle"></h2>
      <button class="mutehome" id="muteLes" style="position:static">🔊</button>
    </div>
    <div class="lesbody" id="lesBody"></div>
    <div class="clearov" id="clearOv">
      <div class="gface" id="clearFace"></div>
      <h1 id="clearH">できた！🎉</h1>
      <p id="clearP"></p>
      <div class="homebtns">
        <button class="bigbtn" id="clearNext">つぎへ ▶</button>
        <button class="bigbtn pink" id="clearHome">おうちへ</button>
      </div>
    </div>
  </section>
</div>
<script src="art.js"></script>
<script src="snd.js"></script>
<script src="lesson.js"></script>
</body>
</html>
